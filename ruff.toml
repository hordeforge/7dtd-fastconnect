# Project-wide ruff config: deterministic linting regardless of user-level
# ~/.config/ruff settings (ruff falls back to those when no project config
# exists, which made local runs diverge).
line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors, incl. E501 hard 100-column cap
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/vars, undefined names
    "B",   # flake8-bugbear: bug-prone constructs
    "I",   # import sorting
    "UP",  # pyupgrade: modern syntax
    "RUF", # ruff-native rules
    "EXE", # shebang/executable-bit hygiene
    "PL",  # pylint-derived correctness checks
    "A",   # builtin shadowing
    "ARG", # unused function arguments
    "C4",  # comprehension simplification
    "DTZ", # naive datetime construction
    "FURB",# refurb modernization checks
    "PTH", # os.path -> pathlib
    "PERF",# performance lints
    "RET", # return simplification
    "RSE", # unnecessary parens on raise
    "S",   # flake8-bandit: security and dangerous-construct checks
    "SIM", # flake8-simplify
    "EM",  # flake8-errmsg: exception messages as named variables
    "COM818", # missing trailing comma on bare tuple
    "COM819", # prohibited trailing comma
    "ISC", # flake8-implicit-str-concat
    "Q",   # flake8-quotes
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ERA", # eradicate: commented-out code
]

[lint.per-file-ignores]
# Tests assert with bare `assert` and drive the launcher through a stub Proton
# on PATH by name, so the assert and partial-path subprocess findings that
# matter in shipped code do not apply to them.
"scripts/test_*.py" = ["S101", "S603", "S607"]
# coverage_badge.py parses the Cobertura XML that make coverage just generated
# in the same directory, not anything a third party can hand it.
"scripts/coverage_badge.py" = ["S314"]
