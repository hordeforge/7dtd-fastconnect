[project]
name = "7dtd-fastconnect-dev"
version = "0.13.0"
description = "Dev tooling for 7dtd-fastconnect offline gates (ruff/mypy/pytest/yamllint)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

# The Python gates install four pinned tools, so where they come from is part
# of the build and is declared here instead of inherited, the same reason
# NuGet.config clears the inherited sources. Without a named index uv honors
# UV_DEFAULT_INDEX and any user-level config, and a mirror on another host can
# answer for these package ids; uv.lock's per-artifact sha256 then fails the
# install, or, if the mirror serves different bytes under the same name, the
# gate runs against a toolchain no file in the tree describes.
[tool.uv]
# uv that cannot read the revision this uv.lock is written at would have to
# re-lock to do anything with it, and the rewritten file is one the CI uv then
# re-resolves, without the per-artifact hashes the install is verified
# against. Refuse the command and name the upgrade instead.
required-version = ">=0.9.0"
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "yamllint==1.38.0",
]

# Lint/typecheck settings live in ruff.toml and mypy.ini: those filenames
# outrank [tool.*] sections here (first config found wins, no merging), so
# keeping them out of this file avoids two drifting copies of each setting.

# The game build this mod targets. It is the value the client advertises when
# its own Constants.cVersionInformation cannot be read
# (ConnectTarget.PlaceholderServerVersion), which is a wire field nothing else
# in the tree records, so a game update that moves it without moving this key
# would leave the client advertising the previous build. test_version_sync.sh
# fails instead.
[tool.fastconnect]
game-version = "V.3.1.4"

[tool.pytest.ini_options]
testpaths = ["scripts"]
# tmp_path stages whole fake game trees; the default base is /tmp, which is
# tmpfs here, so those fixtures would be charged to RAM. Keep them in the
# repo's gitignored scratch dir like every other temporary in this project.
addopts = "--basetemp=.scratch/pytest"
