name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce.
#
# The mod archive is deliberately NOT built here. `make package` compiles
# against the dedicated server's own assemblies, which a hosted runner does
# not have; a maintainer with a game install runs `make package` and attaches
# the zip. Gating the tag is the half that can be proven automatically, and
# asserting the other half here would be a claim, not evidence.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      # Same checkout pin as ci.yml; one version of one action across workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches every shipped version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="ModInfo.xml"
          case "$TAG" in
            v*) ;;
            *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1 ;;
          esac
          SHIPPED="$(sed -n 's/.*<Version[^>]*value="\([^"]*\)".*/\1/p' "$MANIFEST" | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no <Version value=\"...\"> found in $MANIFEST" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED)"
      # The manifest is one of three declarations of the same number
      # (ModInfo.xml, ModApi.cs, pyproject.toml); the gate that keeps them
      # together is otherwise only in `make test`, which a tag push never
      # runs. That is the drift that shipped 0.10.5 pointing at a 0.10.4
      # build.
      - name: Check every version declaration agrees
        run: ./scripts/test_version_sync.sh
      # Each section in CHANGELOG.md matches a release tag, so a release with
      # no notes is a release nobody can find the changes of.
      - name: Check the changelog has a section for the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -qF -- "## [$TAG]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [$TAG]' section; write the notes first" >&2
            exit 1
          fi
          echo "ok: CHANGELOG.md has a section for $TAG"
