name: ci
on: [push, pull_request]
# One run per ref at a time: a superseded commit cancels the earlier run, so
# two main pushes can never race the coverage-badge push (non-fast-forward on
# the badges branch would turn main red).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connect:
    runs-on: ubuntu-latest
    # Same budget as the badge lane; without it a hung dotnet restore blocks
    # the runner for the 6h default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        # No dotnet-version input on purpose: setup-dotnet reads the band
        # pinned by global.json, keeping one source of truth for local and CI.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - run: make test

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: connect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Same pins as the connect job above (dependabot bumps both together):
      # running two different majors of one action inside a single workflow
      # means only half of it gets security fixes each week.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # Version comes from global.json (same band as make build locally).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --tool-path into the runner tool dir that is put on PATH on the next
      # line. A bare `-g` install lands in $DOTNET_ROOT/tools, which the hosted
      # image does not export, and scripts/coverage-cs.sh answers a missing
      # dotnet-coverage with SKIP + exit 0, so the job would have gone on to
      # fail on a stale badge instead of naming the missing tool. The version
      # is pinned, the one number that decides what the badge measures.
      - run: dotnet tool install dotnet-coverage --tool-path "$HOME/.dotnet/tools" --version 17.14.1
      - run: echo "$HOME/.dotnet/tools" >>"$GITHUB_PATH"
      - run: make coverage
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate through an http.extraheader rather than a token in the
          # remote URL: a URL with the token in it is written to .git/config on
          # disk and shows up in the process table for every git command.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$auth"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          # make coverage already rendered the badge at the repo root from the
          # same Cobertura XML and filter; publish that copy directly.
          cp coverage.svg badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
