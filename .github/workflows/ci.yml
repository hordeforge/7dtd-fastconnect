name: ci
# badges/ is the branch the coverage-badge job below writes: it holds
# coverage.svg and no source, so a run over it gates nothing. Its pushes
# arrive with GITHUB_TOKEN and would not trigger a run anyway; the ignore
# keeps a manual push there from spending a full `make test` on one SVG.
#
# tags is named next to it because defining only branches-ignore would drop
# tag pushes from the trigger entirely (GitHub: a push filter that names one
# ref kind does not fire for the other). A release zip is built from the
# tagged commit, so that commit gets the gate here too.
on:
  push:
    branches-ignore: [badges]
    tags: ["v*"]
  pull_request:
# One run per ref at a time: a superseded commit cancels the earlier run, so
# two main pushes can never race the coverage-badge push (non-fast-forward on
# the badges branch would turn main red).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connect:
    runs-on: ubuntu-latest
    # Same budget as the badge lane; without it a hung dotnet restore blocks
    # the runner for the 6h default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # No dotnet-version input on purpose: setup-dotnet reads the band
        # pinned by global.json, keeping one source of truth for local and CI.
        # cache keys the uv cache dir (the four pinned dev tools, the wheels
        # behind them, and the CPython that requires-python pulls) on uv.lock.
        # The gates run `uv run --locked` five times, so without it every run
        # re-downloaded all of it from PyPI. The key is the lockfile, not
        # pyproject.toml: a pin edited without a re-lock fails the `--locked`
        # run either way, and uv.lock is what the install is resolved from.
        with:
          cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - run: make test

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: connect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Same pins as the connect job above (dependabot bumps both together):
      # running two different majors of one action inside a single workflow
      # means only half of it gets security fixes each week.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # Version comes from global.json (same band as make build locally).
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # Same cache key as the connect job: `make coverage` reaches uv for
        # coverage_badge.py, and uv re-resolves the dev group to run it.
        with:
          cache: true
          cache-dependency-glob: uv.lock
      # dotnet-coverage is declared in .config/dotnet-tools.json, so the
      # version that decides what the badge measures is stated in one file and
      # this step installs exactly that. --tool-path into the runner tool dir
      # that is put on PATH on the next line: a local tool otherwise installs
      # under .config/ in the checkout, and a bare `-g` install lands in
      # $DOTNET_ROOT/tools, which the hosted image does not export, so
      # scripts/coverage-cs.sh would answer the missing tool with SKIP + exit
      # 0 and the job would have gone on to fail on a stale badge.
      - run: dotnet tool restore --tool-path "$HOME/.dotnet/tools"
      - run: echo "$HOME/.dotnet/tools" >>"$GITHUB_PATH"
      - run: make coverage
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate through an http.extraheader rather than a token in the
          # remote URL: a URL with the token in it is written to .git/config on
          # disk and shows up in the process table for every git command.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$auth"
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          # make coverage already rendered the badge at the repo root from the
          # same Cobertura XML and filter; publish that copy directly.
          cp coverage.svg badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
